[project]
name = "thesis-d3"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "nh3>=0.3.7",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=7.4.1",
    "reflex>=0.10.0",
    "rq>=2.12.0",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
ml = [
    "fairlearn>=0.15.0",
    "jupyterlab>=4.6.4",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "optuna>=5.0.0",
    "pingouin>=0.7.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]
   [tool.pytest.ini_options]
   pythonpath = ["."]
   testpaths = ["tests"]