# Shared FHRS test cases, from the CDSS Data Dictionary, FHRS Guide (Oct 31, 2026).
# tests/test_fhrs_cases.py runs them through backend/fhrs.py.
# ml/test_fhrs_cases.py runs the same cases through fhrs() in ml/synthetic/01_syntgen.ipynb.
#
# One row = one relative with one diagnosis. Two rows with the same relative and relative_no
# (default 1) are one person with two diagnoses.
#   diagnosis  what the patient typed (read by the backend)
#   disease    the generator's label for it: CVD, T2D, asthma, COPD, depression or GAD
#   age        age at diagnosis; null = unknown
#   confirmed  true = confirmed by a doctor
# exposures: the generator reads these names from the patient. The backend has no such field,
# so its test sets shared_environment on every row instead (household E: see fhrs.py).
#
# Expected values: score, band, clustering (C) and people (affected relatives).
# The generator returns only score and band, so its test checks only those.

cases:
  - name: no_relatives
    domain: T2D
    relatives: []
    expected: {score: 0.0, band: Baseline, clustering: 0.0, people: 0}

  - name: unknown_age_scores_as_typical
    domain: T2D
    relatives:
      - {relative: father, diagnosis: Type 2 diabetes, disease: T2D, age: null, confirmed: true}
    expected: {score: 0.5, band: Mild, clustering: 0.0, people: 1}

  # Each relative is a person
  - name: two_brothers_confirmed_t2d_typical
    domain: T2D
    relatives:
      - {relative: brother, relative_no: 1, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: brother, relative_no: 2, diagnosis: Type 2 diabetes, disease: T2D, age: 58, confirmed: true}
    expected: {score: 2.0, band: Moderate, clustering: 1.0, people: 2}

  - name: three_sisters_are_three_people
    domain: T2D
    relatives:
      - {relative: sister, relative_no: 1, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: sister, relative_no: 2, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: sister, relative_no: 3, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
    expected: {score: 2.5, band: Moderate, clustering: 1.0, people: 3}

  # C is flat, once
  - name: three_confirmed_first_degree_typical
    domain: T2D
    relatives:
      - {relative: father, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: mother, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: brother, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
    expected: {score: 2.5, band: Moderate, clustering: 1.0, people: 3}

  # No bonus below first degree
  - name: two_confirmed_grandparents_no_bonus
    domain: T2D
    relatives:
      - {relative: paternal_grandfather, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: maternal_grandmother, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
    expected: {score: 0.5, band: Mild, clustering: 0.0, people: 2}

  - name: two_confirmed_cousins_no_bonus
    domain: T2D
    relatives:
      - {relative: maternal_male_cousin, relative_no: 1, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: maternal_male_cousin, relative_no: 2, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
    expected: {score: 0.25, band: Mild, clustering: 0.0, people: 2}

  - name: one_confirmed_one_unconfirmed_first_degree_no_bonus
    domain: T2D
    relatives:
      - {relative: father, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
      - {relative: mother, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: false}
    expected: {score: 0.75, band: Mild, clustering: 0.0, people: 2}

  # One person, two diagnoses: one term and no bonus. The higher term is listed first because
  # the generator keeps the first (its break). tests/test_family_history.py covers lower-first.
  - name: same_relative_two_diagnoses_counts_once
    domain: CVD
    relatives:
      - {relative: father, diagnosis: Heart attack, disease: CVD, age: 50, confirmed: true}
      - {relative: father, diagnosis: Stroke, disease: CVD, age: 60, confirmed: true}
    expected: {score: 1.0, band: Mild, clustering: 0.0, people: 1}

  # "Same disease" = the generator's label, not the typed text and not the domain
  - name: asthma_and_copd_are_different_diseases
    domain: CRD
    relatives:
      - {relative: father, diagnosis: Asthma, disease: asthma, age: 30, confirmed: true}
      - {relative: mother, diagnosis: COPD, disease: COPD, age: 55, confirmed: true}
    expected: {score: 1.0, band: Mild, clustering: 0.0, people: 2}

  - name: two_kinds_of_asthma_text_are_the_same_disease
    domain: CRD
    relatives:
      - {relative: father, diagnosis: Asthma, disease: asthma, age: 30, confirmed: true}
      - {relative: mother, diagnosis: Adult-onset asthma, disease: asthma, age: 35, confirmed: true}
    expected: {score: 2.0, band: Moderate, clustering: 1.0, people: 2}

  - name: depression_and_anxiety_are_different_diseases
    domain: NEURO
    relatives:
      - {relative: mother, diagnosis: Depression, disease: depression, age: 30, confirmed: true}
      - {relative: father, diagnosis: Generalized anxiety disorder, disease: GAD, age: 30, confirmed: true}
    expected: {score: 1.0, band: Mild, clustering: 0.0, people: 2}

  - name: neuro_has_e_1
    domain: NEURO
    exposures: [secondhand_smoke]
    relatives:
      - {relative: mother, diagnosis: Depression, disease: depression, age: 30, confirmed: true}
    expected: {score: 0.5, band: Mild, clustering: 0.0, people: 1}

  # The Guide's worked example: (1.0 + 1.5 + 0.125 + 1.0) x 1.15 = 4.16875
  - name: john
    domain: CVD
    exposures: [secondhand_smoke]
    relatives:
      - {relative: father, diagnosis: Heart attack, disease: CVD, age: 48, confirmed: true}
      - {relative: brother, diagnosis: Heart stent, disease: CVD, age: 38, confirmed: true}
      - {relative: paternal_uncle, diagnosis: Heart disease, disease: CVD, age: 60, confirmed: false}
    expected: {score: 4.17, band: Pronounced, clustering: 1.0, people: 3}

  # Families that land on a band edge
  - name: edge_1_75
    domain: T2D
    relatives:
      - {relative: father, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: paternal_grandfather, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
    expected: {score: 1.75, band: Mild, clustering: 0.0, people: 2}

  - name: edge_3_50
    domain: T2D
    relatives:
      - {relative: father, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: mother, diagnosis: Type 2 diabetes, disease: T2D, age: 45, confirmed: true}
    expected: {score: 3.5, band: Moderate, clustering: 1.0, people: 2}

  - name: edge_6_00
    domain: T2D
    relatives:
      - {relative: father, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: mother, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: brother, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: sister, diagnosis: Type 2 diabetes, disease: T2D, age: 55, confirmed: true}
    expected: {score: 6.0, band: Pronounced, clustering: 1.0, people: 4}

  - name: above_6_00
    domain: T2D
    relatives:
      - {relative: father, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: mother, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: brother, diagnosis: Type 2 diabetes, disease: T2D, age: 35, confirmed: true}
      - {relative: sister, diagnosis: Type 2 diabetes, disease: T2D, age: 45, confirmed: true}
    expected: {score: 6.5, band: Critical, clustering: 1.0, people: 4}

# Score -> band, every edge of 0 / 0.10-1.75 / 1.76-3.50 / 3.51-6.00 / > 6.00
band_edges:
  - {score: 0.0, band: Baseline}
  - {score: 0.10, band: Mild}
  - {score: 1.75, band: Mild}
  - {score: 1.76, band: Moderate}
  - {score: 3.50, band: Moderate}
  - {score: 3.51, band: Pronounced}
  - {score: 6.00, band: Pronounced}
  - {score: 6.01, band: Critical}
